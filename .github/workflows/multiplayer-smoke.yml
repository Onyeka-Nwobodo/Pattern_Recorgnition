name: Multiplayer smoke test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "smoke-test.mjs"
      - ".github/workflows/multiplayer-smoke.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/word-scramble-server.log 2>&1 &
      - name: Run two-browser multiplayer test
        run: node smoke-test.mjs
