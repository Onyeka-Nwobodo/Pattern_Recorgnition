name: Easy vocabulary multiplayer smoke test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "easy-vocab/index.html"
      - "easy-vocab-smoke-test.mjs"
      - ".github/workflows/easy-vocab-smoke.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/easy-vocab-server.log 2>&1 &
      - name: Run easier vocabulary multiplayer test
        run: node easy-vocab-smoke-test.mjs
